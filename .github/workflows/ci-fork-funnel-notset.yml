# Fork-only CI. Upstream's ci-backend.yml shards the whole suite across a large runner
# fleet with pytest-split, turbo and a shared schema cache; none of that is reproducible
# in a fork. This runs just the two areas this fork changes, on a stock runner:
#
#   - the funnel suite, because the funnelWindowBoundary change must leave every existing
#     funnel bit-for-bit unchanged on the default "clip" path — that regression guard is
#     the point, so the whole directory runs, not only the new file
#   - the HogQL property tests, for the "(not set)" sentinel
#   - the schema generators, because schema.py / schema.json / schema-general.ts were
#     hand-edited here and drift between them fails silently at runtime
#
# Steps mirror ci-backend.yml's turbo-tests job. Keep them in sync when rebasing on upstream.
name: Fork CI

on:
    push:
        branches: ['**']
    pull_request:
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    SECRET_KEY: '6b01eee4f945ca25045b5aab440b953461faf08693a9abbf1166dc7c6b9772da' # unsafe - for testing only
    DATABASE_URL: 'postgres://posthog:posthog@localhost:5432/posthog'
    REDIS_URL: 'redis://localhost'
    CLICKHOUSE_HOST: 'localhost'
    CLICKHOUSE_SECURE: 'False'
    CLICKHOUSE_VERIFY: 'False'
    TEST: 1
    OBJECT_STORAGE_ENABLED: 'True'
    OBJECT_STORAGE_ENDPOINT: 'http://localhost:19000'
    OBJECT_STORAGE_ACCESS_KEY_ID: 'object_storage_root_user'
    OBJECT_STORAGE_SECRET_ACCESS_KEY: 'object_storage_root_password'
    UV_HTTP_TIMEOUT: 120
    DISPLAY: ':99.0'

jobs:
    backend:
        name: Funnel + property tests
        runs-on: ubuntu-latest
        timeout-minutes: 90

        steps:
            - uses: actions/checkout@v6

            # Start Docker before the dependency installs so images pull while we install.
            - name: Start services
              env:
                  COMPOSE_FILE: docker-compose.dev.yml:docker-compose.profiles.yml
              run: |
                  # Installs aggregate_funnel and friends. Without this the funnel tests fail
                  # with "Unknown function aggregate_funnel" rather than a real assertion.
                  cp posthog/user_scripts/latest_user_defined_function.xml docker/clickhouse/user_defined_function.xml
                  bin/ci-wait-for-docker launch --background --down \
                    db redis7 clickhouse zookeeper kafka objectstorage

            - name: Set up Python
              uses: ./.github/actions/setup-python-cached
              with:
                  python-version: 3.13.13

            - name: Install uv
              uses: astral-sh/setup-uv@v7
              with:
                  enable-cache: true

            - name: Install SAML dependencies
              run: |
                  sudo rm -f /etc/apt/sources.list.d/*twingate*
                  sudo apt-get update
                  sudo apt-get install -y libxml2-dev libxmlsec1-dev libxmlsec1-openssl

            - name: Install Python dependencies
              run: UV_PROJECT_ENVIRONMENT=$pythonLocation uv sync --frozen --dev

            # Upstream reads these from repo-level `vars`, which a fork does not inherit.
            # Django only needs a syntactically valid key here, so generate a throwaway one.
            - name: Generate throwaway OIDC keys
              run: |
                  {
                    echo 'OIDC_RSA_PRIVATE_KEY<<PEMEOF'
                    openssl genrsa 2048 2>/dev/null
                    echo 'PEMEOF'
                    echo 'SANDBOX_JWT_PRIVATE_KEY<<PEMEOF'
                    openssl genrsa 2048 2>/dev/null
                    echo 'PEMEOF'
                  } >> "$GITHUB_ENV"

            - name: Add service hostnames to /etc/hosts
              run: echo "127.0.0.1 db redis7 kafka clickhouse clickhouse-coordinator objectstorage" | sudo tee -a /etc/hosts

            - name: Set up needed files
              run: |
                  mkdir -p frontend/dist
                  touch frontend/dist/index.html frontend/dist/layout.html frontend/dist/exporter.html
                  ./bin/download-mmdb

            - name: Wait for Docker services
              env:
                  COMPOSE_FILE: docker-compose.dev.yml:docker-compose.profiles.yml
              run: bin/ci-wait-for-docker wait objectstorage

            - name: Run funnel and property tests
              run: |
                  pytest -v --tb=short -m "not async_migrations" \
                    posthog/hogql_queries/insights/funnels/test/ \
                    posthog/hogql/test/test_property.py

    schema:
        name: Generated schema is in sync
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - uses: actions/checkout@v6

            - name: Install pnpm dependencies
              uses: ./.github/actions/pnpm-install

            - name: Set up Python
              uses: ./.github/actions/setup-python-cached
              with:
                  python-version: 3.13.13

            - name: Install uv
              uses: astral-sh/setup-uv@v7
              with:
                  enable-cache: true

            - name: Install Python dependencies
              run: UV_PROJECT_ENVIRONMENT=$pythonLocation uv sync --frozen --dev

            # schema.json and schema.py were hand-edited on this fork rather than generated.
            # If either differs from what the generator produces, this fails with the diff.
            - name: Regenerate schema.json and check for drift
              run: |
                  pnpm --filter=@posthog/frontend schema:build:json
                  git diff --exit-code -- frontend/src/queries/schema.json frontend/src/queries/validators.js

            - name: Regenerate schema.py and check for drift
              run: |
                  pnpm schema:build:python
                  git diff --exit-code -- posthog/schema.py

    typecheck:
        name: Frontend typecheck
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - uses: actions/checkout@v6

            - name: Install pnpm dependencies
              uses: ./.github/actions/pnpm-install

            - name: Run typescript check
              run: pnpm --filter=@posthog/frontend typescript:check
